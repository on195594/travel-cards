services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env.local
        required: false
        format: raw
    environment:
      MONGODB_URI: mongodb://mongodb:27017/travel_cards
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    networks:
      meemo:
      edge:
        aliases:
          - travel-cards-web

networks:
  meemo:
    external: true
    name: meemo_backend
  edge:
    external: true
    name: nginx-network
