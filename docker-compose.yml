services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.example
      - path: .env.local
        required: false
        format: raw
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    networks:
      meemo:
      edge:
        aliases:
          - travel-cards-web

networks:
  meemo:
    external: true
    name: ${MEEMO_NETWORK:-meemo_backend}
  edge:
    external: true
    name: ${EDGE_NETWORK:-nginx-network}
